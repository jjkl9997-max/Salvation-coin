<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #0b1329;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #333;
    }

    /* 모바일 앱 뷰포트 컨테이너 */
    #app-container {
      position: relative;
      width: 100vw;
      max-width: 440px;
      height: 100vh;
      max-height: 820px;
      background: #0f172a;
      border-radius: 0px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 480px) {
      #app-container {
        border-radius: 24px;
        height: 90vh;
      }
    }

    /* 상단 유틸리티 바 (HUD) */
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      gap: 6px;
    }

    .top-pill {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 6px 10px;
      border-radius: 20px;
      color: white;
      font-size: 0.88rem;
      font-weight: 700;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .top-pill.timer {
      color: #fde047;
    }

    .icon-btn {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      font-size: 1rem;
      padding: 6px 10px;
      border-radius: 50%;
      cursor: pointer;
      pointer-events: auto;
    }

    /* 캔버스 게임 화면 */
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(180deg, #091224 0%, #1e293b 65%, #334155 100%);
    }

    /* UI 오버레이 */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 19, 41, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      z-index: 20;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      display: none;
    }

    .game-logo {
      font-size: 68px;
      margin-bottom: 8px;
      filter: drop-shadow(0 6px 12px rgba(220, 38, 38, 0.4));
      animation: bellShake 2s infinite ease-in-out;
    }

    @keyframes bellShake {
      0%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(14deg); }
      30% { transform: rotate(-12deg); }
      45% { transform: rotate(8deg); }
      60% { transform: rotate(-4deg); }
      75% { transform: rotate(0deg); }
    }

    .game-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #f8fafc;
      margin-bottom: 12px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .game-desc-box {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 320px;
    }

    .game-desc {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .game-notice {
      font-size: 0.88rem;
      color: #fde047;
      font-weight: 700;
      line-height: 1.5;
      background: rgba(234, 179, 8, 0.15);
      border-radius: 10px;
      padding: 8px 10px;
      border: 1px dashed rgba(253, 224, 71, 0.4);
    }

    .btn {
      background: #dc2626;
      color: #ffffff;
      border: none;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 14px 36px;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 6px 0 #991b1b, 0 10px 18px rgba(220, 38, 38, 0.4);
      transition: all 0.1s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #991b1b;
    }

    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
      box-shadow: 0 4px 0 #1e293b;
      font-size: 0.92rem;
      padding: 10px 16px;
    }

    .btn-secondary:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #1e293b;
    }

    /* 결과 모달 카드 */
    .result-card {
      background: white;
      border-radius: 22px;
      padding: 24px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.4);
      margin-bottom: 18px;
    }

    .result-title {
      font-size: 1.05rem;
      color: #64748b;
      font-weight: 700;
    }

    .result-score {
      font-size: 2.1rem;
      font-weight: 900;
      color: #dc2626;
      margin: 8px 0;
    }

    .result-best {
      font-size: 0.85rem;
      color: #b45309;
      font-weight: 700;
      background: #fef3c7;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 8px;
    }

    .result-hint {
      margin-top: 12px;
      font-size: 0.82rem;
      color: #475569;
      background: #f1f5f9;
      padding: 8px;
      border-radius: 8px;
      font-weight: 600;
    }

    .share-group {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    /* 토스트 알림 */
    #toast {
      position: absolute;
      bottom: 24px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 상단 HUD 바 -->
  <div id="top-bar">
    <div class="top-pill" id="hud-score">🪙 0원</div>
    <div class="top-pill timer" id="hud-timer">⏱️ 45초</div>
    <div style="display: flex; gap: 6px; align-items: center;">
      <div class="top-pill" id="hud-lives">❤️❤️❤️</div>
      <button class="icon-btn" id="sound-btn">🔊</button>
    </div>
  </div>

  <!-- 메인 캔버스 -->
  <canvas id="gameCanvas" width="400" height="700"></canvas>

  <!-- 1. 시작 화면 오버레이 -->
  <div class="overlay" id="start-screen">
    <div class="game-logo">🔔</div>
    <h1 class="game-title">구세군 자선냄비</h1>
    <div class="game-desc-box">
      <p class="game-desc">
        ❄️ 좌우로 움직여 떨어지는 후원금과 동전을 자선냄비에 받아주세요!<br>
        🧊 차가운 얼음/눈덩이를 피하고 <b>45초</b> 동안 최대한 많은 성금을 모아보세요.
      </p>
      <div class="game-notice">
        📌 점수 달성 후 해당 멘션 밑에 캡쳐 화면을 보여주세요.
      </div>

    <button class="btn" id="start-btn">모금 시작하기 ❤️</button>

  <!-- 2. 게임오버 화면 오버레이 -->
  <div class="overlay hidden" id="gameover-screen">

      <div class="result-title">최종 모금액</div>

      <div class="share-group">
        <button class="btn btn-secondary" style="flex:1;" id="twitter-share-btn">𝕏 공유</button>
        <button class="btn btn-secondary" style="flex:1;" id="copy-link-btn">🔗 링크 복사</button>
      </div>
    </div>
    <button class="btn" id="restart-btn">다시 기부하기 🔄</button>
  </div>

  <!-- 링크 복사 토스트 메시지 -->
  <div id="toast">링크가 복사되었습니다!</div>
</div>

<script>
  /* ----------------------------------------------------
     1. 사운드 시스템 (Web Audio API)
  ---------------------------------------------------- */
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSound(type) {
    if (!soundEnabled || !audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;

    if (type === 'bell' || type === 'coin') {
      // 자선냄비 종소리 (맑은 벨 톤 합성)
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc1.type = 'sine';
      osc2.type = 'triangle';
      
      const freq = type === 'coin' ? 1046.50 : 1318.51; // C6 or E6
      osc1.frequency.setValueAtTime(freq, now);
      osc2.frequency.setValueAtTime(freq * 2.02, now);

      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.25);
      osc2.stop(now + 0.25);
    } else if (type === 'hit') {
      // 장애물 부딪힘 (얼음 깨짐/눈 충돌)
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'gameover') {
      // 종료 징글
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        gain.gain.setValueAtTime(0.2, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.3);
      });
    }
  }

  /* ----------------------------------------------------
     2. 게임 상태 & 캔버스 로직
  ---------------------------------------------------- */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const GAME_DURATION = 45; // 45초
  let timeLeft = GAME_DURATION;
  let timerInterval = null;

  let score = 0;
  let lives = 3;
  let isPlaying = false;
  let frame = 0;
  let items = [];
  let floatingTexts = [];
  let snowflakes = [];

  // 구세군 자선냄비 오브젝트
  const kettle = {
    x: 160,
    y: 590,
    width: 80,
    height: 70,
    speed: 7.5
  };

  const keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false };

  // 눈송이 배경 입자 초기화
  for (let i = 0; i < 45; i++) {
    snowflakes.push({
      x: Math.random() * 400,
      y: Math.random() * 700,
      radius: Math.random() * 2.8 + 1,
      speedY: Math.random() * 1.2 + 0.8,
      speedX: Math.random() * 0.8 - 0.4
    });
  }

  function getHighScore() {
    return parseInt(localStorage.getItem('redkettle_highscore') || '0', 10);
  }

  function saveHighScore(val) {
    if (val > getHighScore()) {
      localStorage.setItem('redkettle_highscore', val);
    }
  }

  function spawnItem() {
    const rand = Math.random();
    let type = '100';
    let value = 100;
    let radius = 17;
    let color = '#fbbf24';
    let speed = 3.6 + Math.min(score / 8000, 3.2);

    if (rand < 0.18) {
      type = 'ice'; // 얼음/눈폭탄
      value = -1;
      radius = 19;
      color = '#93c5fd';
      speed += 1.0;
    } else if (rand < 0.50) {
      type = '500';
      value = 500;
      radius = 20;
      color = '#e2e8f0';
    } else if (rand < 0.72) {
      type = '1000';
      value = 1000;
      radius = 23;
      color = '#60a5fa';
    } else if (rand < 0.82) {
      type = '5000'; // 고액 후원권
      value = 5000;
      radius = 25;
      color = '#f472b6';
      speed += 0.5;
    }

    items.push({
      x: Math.random() * (canvas.width - radius * 2) + radius,
      y: -radius,
      radius,
      type,
      value,
      color,
      speed
    });
  }

  function checkCollision(circle, rect) {
    // 냄비 윗부분 입구 쪽으로 충돌 판정 최적화
    const hitRect = {
      x: rect.x + 5,
      y: rect.y + 10,
      width: rect.width - 10,
      height: rect.height - 15
    };
    const closestX = Math.max(hitRect.x, Math.min(circle.x, hitRect.x + hitRect.width));
    const closestY = Math.max(hitRect.y, Math.min(circle.y, hitRect.y + hitRect.height));
    const distX = circle.x - closestX;
    const distY = circle.y - closestY;
    return (distX * distX + distY * distY) < (circle.radius * circle.radius);
  }

  function update() {
    // 배경 눈 내리기 효과
    snowflakes.forEach(snow => {
      snow.y += snow.speedY;
      snow.x += snow.speedX;
      if (snow.y > canvas.height) {
        snow.y = -5;
        snow.x = Math.random() * canvas.width;
      }
    });

    if (!isPlaying) return;
    frame++;

    // 키보드 조작
    if (keys.ArrowLeft || keys.a) kettle.x -= kettle.speed;
    if (keys.ArrowRight || keys.d) kettle.x += kettle.speed;

    // 경계 제약
    kettle.x = Math.max(0, Math.min(canvas.width - kettle.width, kettle.x));

    // 아이템 스폰 (시간이 지날수록 약간 빠르게)
    const spawnRate = Math.max(20, 36 - Math.floor((GAME_DURATION - timeLeft) / 3));
    if (frame % spawnRate === 0) spawnItem();

    // 아이템 이동 및 충돌
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.speed;

      if (checkCollision(it, kettle)) {
        if (it.type === 'ice') {
          lives--;
          playSound('hit');
          floatingTexts.push({ text: '❄️ 얼음! -1', x: it.x, y: it.y, color: '#93c5fd', opacity: 1, life: 30 });
          if (lives <= 0) {
            endGame();
            return;
          }
        } else {
          score += it.value;
          playSound('bell');
          const isBig = it.value >= 1000;
          floatingTexts.push({ 
            text: `+${it.value.toLocaleString()}원`, 
            x: it.x, 
            y: it.y, 
            color: isBig ? '#fde047' : '#ffffff', 
            opacity: 1, 
            life: 25 
          });
        }
        updateHUD();
        items.splice(i, 1);
        continue;
      }

      if (it.y - it.radius > canvas.height) {
        items.splice(i, 1);
      }
    }

    // 부유 텍스트
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y -= 1.8;
      ft.opacity -= 1 / ft.life;
      if (ft.opacity <= 0) floatingTexts.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 눈송이 그리기
    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    snowflakes.forEach(snow => {
      ctx.beginPath();
      ctx.arc(snow.x, snow.y, snow.radius, 0, Math.PI * 2);
      ctx.fill();
    });

    // 2. 바닥 눈밭 언덕 그리기
    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.ellipse(120, 710, 240, 60, 0, 0, Math.PI * 2);
    ctx.ellipse(320, 715, 200, 55, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.ellipse(200, 725, 260, 60, 0, 0, Math.PI * 2);
    ctx.fill();

    // 3. 떨어지는 아이템 렌더링
    items.forEach(it => {
      ctx.save();
      ctx.beginPath();
      ctx.arc(it.x, it.y, it.radius, 0, Math.PI * 2);
      ctx.fillStyle = it.color;
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = it.type === 'ice' ? '#3b82f6' : '#b45309';
      ctx.stroke();

      ctx.fillStyle = it.type === 'ice' ? '#1e3a8a' : '#78350f';
      ctx.font = 'bold 12px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(it.type === 'ice' ? '❄️' : it.type, it.x, it.y);
      ctx.restore();
    });

    // 4. 구세군 자선냄비 렌더링
    drawRedKettle(kettle.x, kettle.y, kettle.width, kettle.height);

    // 5. 부유 텍스트
    floatingTexts.forEach(ft => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.opacity);
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 17px -apple-system, sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 4;
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    });

    requestAnimationFrame(draw);
  }

  // 구세군 자선냄비 그래픽 드로잉 함수
  function drawRedKettle(x, y, w, h) {
    ctx.save();
    
    // 자선냄비 삼각대 (거치대 프레임)
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + 10, y + h + 8);
    ctx.lineTo(x + w / 2, y + 2);
    ctx.lineTo(x + w - 10, y + h + 8);
    ctx.stroke();

    // 상단 걸이 체인
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y + 2);
    ctx.lineTo(x + w / 2, y + 16);
    ctx.stroke();

    // 냄비 본체 (빨간 자선냄비)
    const potX = x + 8;
    const potY = y + 16;
    const potW = w - 16;
    const potH = h - 22;

    ctx.fillStyle = '#dc2626'; // 구세군 시그니처 레드
    ctx.beginPath();
    ctx.roundRect(potX, potY, potW, potH, [4, 4, 16, 16]);
    ctx.fill();

    // 냄비 테두리 & 입구 라인
    ctx.fillStyle = '#b91c1c';
    ctx.fillRect(potX - 3, potY - 2, potW + 6, 6);

    // 자선냄비 손잡이 귀
    ctx.strokeStyle = '#7f1d1d';
    ctx.lineWidth = 3;
    ctx.strokeRect(potX - 5, potY + 8, 4, 10);
    ctx.strokeRect(potX + potW + 1, potY + 8, 4, 10);

    // 자선냄비 로고 텍스트 & 종 마크
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('구세군', potX + potW / 2, potY + potH / 2 - 2);

    ctx.font = '14px sans-serif';
    ctx.fillText('🔔', potX + potW / 2, potY + potH / 2 + 13);

    ctx.restore();
  }

  function gameLoop() {
    update();
    setTimeout(gameLoop, 1000 / 60);
  }

  /* ----------------------------------------------------
     3. 인터랙션 및 UI 제어
  ---------------------------------------------------- */
  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const hudScore = document.getElementById('hud-score');
  const hudTimer = document.getElementById('hud-timer');
  const hudLives = document.getElementById('hud-lives');
  const soundBtn = document.getElementById('sound-btn');
  const toast = document.getElementById('toast');

  function updateHUD() {
    hudScore.textContent = `🪙 ${score.toLocaleString()}원`;
    hudTimer.textContent = `⏱️ ${timeLeft}초`;
    hudLives.textContent = '❤️'.repeat(Math.max(0, lives));
  }

  function startGame() {
    initAudio();
    score = 0;
    lives = 3;
    timeLeft = GAME_DURATION;
    items = [];
    floatingTexts = [];
    kettle.x = canvas.width / 2 - kettle.width / 2;
    isPlaying = true;
    updateHUD();

    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (!isPlaying) return;
      timeLeft--;
      updateHUD();
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  function endGame() {
    isPlaying = false;
    if (timerInterval) clearInterval(timerInterval);
    playSound('gameover');
    saveHighScore(score);

    document.getElementById('final-score').textContent = `${score.toLocaleString()}원`;
    document.getElementById('best-score-label').textContent = `👑 최고 기록: ${getHighScore().toLocaleString()}원`;
    gameoverScreen.classList.remove('hidden');
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.style.opacity = '1';
    setTimeout(() => { toast.style.opacity = '0'; }, 1800);
  }

  // 조작 핸들러
  window.addEventListener('keydown', (e) => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
  });
  window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
  });

  // 모바일 터치 / 마우스 제어
  function handlePointer(clientX) {
    if (!isPlaying) return;
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    const canvasX = (clientX - rect.left) * scale;
    kettle.x = canvasX - kettle.width / 2;
  }

  canvas.addEventListener('mousemove', (e) => handlePointer(e.clientX));
  canvas.addEventListener('touchmove', (e) => {
    handlePointer(e.touches[0].clientX);
    e.preventDefault();
  }, { passive: false });

  // 버튼 리스너
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);

  soundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
  });

  // 𝕏 (트위터) 공유
  document.getElementById('twitter-share-btn').addEventListener('click', () => {
    const text = `🔔 [구세군 자선냄비] 45초 동안 총 ${score.toLocaleString()}원의 사랑을 모았습니다! 함께 따뜻한 마음을 모아주세요.`;
    const shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`;
    window.open(shareUrl, '_blank');
  });

  // 링크 복사
  document.getElementById('copy-link-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(window.location.href).then(() => {
      showToast('게임 링크가 복사되었습니다!');
    });
  });

  // 실행
  draw();
  gameLoop();
</script>
</body>
</html>
