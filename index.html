<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <title>구세군 자선냄비: 사랑의 모금 게임</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="구세군 자선냄비: 사랑의 모금 게임">
  <meta property="og:description" content="따뜻한 마음을 모아주세요! 45초 동안 얼음을 피해 자선냄비에 기부금을 모아보세요.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: #0b1329;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: #333;
    }

    /* 모바일 앱 뷰포트 컨테이너 */
    #app-container {
      position: relative;
      width: 100vw;
      max-width: 440px;
      height: 100vh;
      max-height: 820px;
      background: #0f172a;
      border-radius: 0px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 480px) {
      #app-container {
        border-radius: 24px;
        height: 90vh;
      }
    }

    /* 상단 HUD 바 */
    #top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .top-pill {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .top-pill.timer {
      color: #fde047;
      font-variant-numeric: tabular-nums;
    }

    .icon-btn {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      font-size: 1.05rem;
      padding: 6px 12px;
      border-radius: 50%;
      cursor: pointer;
      pointer-events: auto;
    }

    /* 캔버스 게임 화면 */
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(180deg, #091224 0%, #1e293b 65%, #334155 100%);
    }

    /* UI 오버레이 */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 19, 41, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      z-index: 20;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      display: none;
    }

    .game-logo {
      font-size: 68px;
      margin-bottom: 8px;
      filter: drop-shadow(0 6px 12px rgba(220, 38, 38, 0.4));
      animation: bellShake 2s infinite ease-in-out;
    }

    @keyframes bellShake {
      0%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(14deg); }
      30% { transform: rotate(-12deg); }
      45% { transform: rotate(8deg); }
      60% { transform: rotate(-4deg); }
      75% { transform: rotate(0deg); }
    }

    .game-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #f8fafc;
      margin-bottom: 12px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .game-desc-box {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 320px;
    }

    .game-desc {
      font-size: 0.9rem;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 10px;
      text-align: left;
    }

    .game-notice {
      font-size: 0.86rem;
      color: #fde047;
      font-weight: 700;
      line-height: 1.5;
      background: rgba(234, 179, 8, 0.15);
      border-radius: 10px;
      padding: 8px 10px;
      border: 1px dashed rgba(253, 224, 71, 0.4);
      text-align: center;
    }

    .btn {
      background: #dc2626;
      color: #ffffff;
      border: none;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 14px 38px;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 6px 0 #991b1b, 0 10px 18px rgba(220, 38, 38, 0.4);
      transition: all 0.1s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #991b1b;
    }

    /* 결과 모달 카드 */
    .result-card {
      background: white;
      border-radius: 22px;
      padding: 26px 20px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.4);
      margin-bottom: 22px;
    }

    .result-title {
      font-size: 1.05rem;
      color: #64748b;
      font-weight: 700;
    }

    .result-score {
      font-size: 2.2rem;
      font-weight: 900;
      color: #dc2626;
      margin: 8px 0;
    }

    .result-best {
      font-size: 0.88rem;
      color: #b45309;
      font-weight: 700;
      background: #fef3c7;
      display: inline-block;
      padding: 5px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .result-hint {
      font-size: 0.84rem;
      color: #0f172a;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 10px;
      font-weight: 700;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- 상단 HUD 바 (스코어, 타이머, 사운드) -->
  <div id="top-bar">
    <div class="top-pill" id="hud-score">🪙 0원</div>
    <div class="top-pill timer" id="hud-timer">⏱️ 45초</div>
    <button class="icon-btn" id="sound-btn">🔊</button>
  </div>

  <!-- 메인 캔버스 -->
  <canvas id="gameCanvas" width="400" height="700"></canvas>

  <!-- 1. 시작 화면 오버레이 -->
  <div class="overlay" id="start-screen">
    <div class="game-logo">🔔</div>
    <h1 class="game-title">구세군 자선냄비</h1>
    <div class="game-desc-box">
      <p class="game-desc">
        ❄️ 좌우로 움직여 떨어지는 후원금을 받아주세요!<br>
        🧊 <b>얼음(눈덩이)에 닿으면 즉시 탈락!</b><br>
        ⚡ <b>15초 이후</b>부터 낙하 속도와 얼음 빈도가 증가합니다.<br>
        🎁 <b>30초 이상 버티면</b> 대박 후원금(5,000원) 등장!
      </p>
      <div class="game-notice">
        📌 점수 달성 후 해당 멘션 밑에 캡쳐 화면을 보여주세요.
      </div>
    </div>
    <button class="btn" id="start-btn">모금 시작하기 ❤️</button>
  </div>

  <!-- 2. 게임오버 화면 오버레이 -->
  <div class="overlay hidden" id="gameover-screen">
    <div class="result-card">
      <div class="result-title">최종 모금액</div>
      <div class="result-score" id="final-score">0원</div>
      <div class="result-best" id="best-score-label">👑 최고 기록: 0원</div>
      <div class="result-hint">📸 캡쳐하여 멘션 밑에 인증 화면을 남겨주세요!</div>
    </div>
    <button class="btn" id="restart-btn">다시 기부하기 🔄</button>
  </div>
</div>

<script>
  /* ----------------------------------------------------
     1. 사운드 시스템 (Web Audio API)
  ---------------------------------------------------- */
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function playSound(type) {
    if (!soundEnabled || !audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;

    if (type === 'coin' || type === 'special') {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc1.type = 'sine';
      osc2.type = 'triangle';
      
      const freq = type === 'special' ? 1567.98 : 1046.50; // G6 or C6
      osc1.frequency.setValueAtTime(freq, now);
      osc2.frequency.setValueAtTime(freq * 1.5, now);

      gain.gain.setValueAtTime(type === 'special' ? 0.35 : 0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + (type === 'special' ? 0.35 : 0.22));

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.35);
      osc2.stop(now + 0.35);
    } else if (type === 'hit') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === 'gameover') {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.12);
        gain.gain.setValueAtTime(0.2, now + idx * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.12);
        osc.stop(now + idx * 0.12 + 0.3);
      });
    }
  }

  /* ----------------------------------------------------
     2. 게임 상태 & 캔버스 로직
  ---------------------------------------------------- */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const GAME_DURATION = 45; // 45초 제한
  let timeLeft = GAME_DURATION;
  let timerInterval = null;

  let score = 0;
  let isPlaying = false;
  let frame = 0;
  let items = [];
  let floatingTexts = [];
  let snowflakes = [];

  const kettle = {
    x: 160,
    y: 590,
    width: 80,
    height: 70,
    speed: 8
  };

  const keys = { ArrowLeft: false, ArrowRight: false, a: false, d: false };

  // 눈송이 배경 입자
  for (let i = 0; i < 45; i++) {
    snowflakes.push({
      x: Math.random() * 400,
      y: Math.random() * 700,
      radius: Math.random() * 2.8 + 1,
      speedY: Math.random() * 1.2 + 0.8,
      speedX: Math.random() * 0.8 - 0.4
    });
  }

  function getHighScore() {
    return parseInt(localStorage.getItem('redkettle_highscore') || '0', 10);
  }

  function saveHighScore(val) {
    if (val > getHighScore()) {
      localStorage.setItem('redkettle_highscore', val);
    }
  }

  /* 난이도 & 아이템 스폰 밸런스 */
  function spawnItem() {
    const elapsed = GAME_DURATION - timeLeft; // 0 ~ 45초
    const rand = Math.random();

    let type = '100';
    let value = 100;
    let radius = 17;
    let color = '#fbbf24';
    let baseSpeed = 3.6;

    // 15초 이후부터 낙하 속도 상승
    if (elapsed > 15) {
      baseSpeed += (elapsed - 15) * 0.18;
    }

    if (elapsed < 15) {
      // [1구간: 0~15초] 평화로운 초반 (얼음 12%)
      if (rand < 0.12) {
        type = 'ice';
        value = -1;
        radius = 18;
        color = '#93c5fd';
      } else if (rand < 0.65) {
        type = '100';
        value = 100;
        radius = 17;
        color = '#fbbf24';
      } else if (rand < 0.90) {
        type = '500';
        value = 500;
        radius = 20;
        color = '#e2e8f0';
      } else {
        type = '1000';
        value = 1000;
        radius = 23;
        color = '#60a5fa';
      }
    } else if (elapsed < 30) {
      // [2구간: 15~30초] 난이도 상승 (얼음 15% -> 28%)
      const iceChance = 0.15 + ((elapsed - 15) / 15) * 0.13;
      if (rand < iceChance) {
        type = 'ice';
        value = -1;
        radius = 19;
        color = '#93c5fd';
        baseSpeed += 0.8;
      } else if (rand < iceChance + 0.35) {
        type = '100';
        value = 100;
        radius = 17;
        color = '#fbbf24';
      } else if (rand < iceChance + 0.65) {
        type = '500';
        value = 500;
        radius = 20;
        color = '#e2e8f0';
      } else {
        type = '1000';
        value = 1000;
        radius = 23;
        color = '#60a5fa';
      }
    } else {
      // [3구간: 30~45초] 피버 구간 (얼음 35% + 5000원 등장)
      if (rand < 0.35) {
        type = 'ice';
        value = -1;
        radius = 20;
        color = '#93c5fd';
        baseSpeed += 1.2;
      } else if (rand < 0.52) {
        type = '5000';
        value = 5000;
        radius = 26;
        color = '#f59e0b';
        baseSpeed += 0.5;
      } else if (rand < 0.72) {
        type = '1000';
        value = 1000;
        radius = 23;
        color = '#60a5fa';
      } else if (rand < 0.88) {
        type = '500';
        value = 500;
        radius = 20;
        color = '#e2e8f0';
      } else {
        type = '100';
        value = 100;
        radius = 17;
        color = '#fbbf24';
      }
    }

    items.push({
      x: Math.random() * (canvas.width - radius * 2) + radius,
      y: -radius,
      radius,
      type,
      value,
      color,
      speed: baseSpeed
    });
  }

  function checkCollision(circle, rect) {
    const hitRect = {
      x: rect.x + 6,
      y: rect.y + 10,
      width: rect.width - 12,
      height: rect.height - 15
    };
    const closestX = Math.max(hitRect.x, Math.min(circle.x, hitRect.x + hitRect.width));
    const closestY = Math.max(hitRect.y, Math.min(circle.y, hitRect.y + hitRect.height));
    const distX = circle.x - closestX;
    const distY = circle.y - closestY;
    return (distX * distX + distY * distY) < (circle.radius * circle.radius);
  }

  function update() {
    // 배경 눈 내리기
    snowflakes.forEach(snow => {
      snow.y += snow.speedY;
      snow.x += snow.speedX;
      if (snow.y > canvas.height) {
        snow.y = -5;
        snow.x = Math.random() * canvas.width;
      }
    });

    if (!isPlaying) return;
    frame++;

    // 키보드 조작
    if (keys.ArrowLeft || keys.a) kettle.x -= kettle.speed;
    if (keys.ArrowRight || keys.d) kettle.x += kettle.speed;

    kettle.x = Math.max(0, Math.min(canvas.width - kettle.width, kettle.x));

    // 시간 경과에 따라 스폰 주기 단축
    const elapsed = GAME_DURATION - timeLeft;
    const currentSpawnRate = Math.max(20, Math.floor(36 - (elapsed / 45) * 16));

    if (frame % currentSpawnRate === 0) {
      spawnItem();
    }

    // 아이템 이동 및 충돌
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.speed;

      if (checkCollision(it, kettle)) {
        if (it.type === 'ice') {
          // 얼음 맞을 시 즉시 사망
          playSound('hit');
          items.splice(i, 1);
          endGame();
          return;
        } else {
          score += it.value;
          if (it.type === '5000') {
            playSound('special');
            floatingTexts.push({ text: '💖 +5,000원!', x: it.x, y: it.y, color: '#fde047', opacity: 1, life: 35, scale: 1.3 });
          } else {
            playSound('coin');
            floatingTexts.push({ text: `+${it.value.toLocaleString()}원`, x: it.x, y: it.y, color: it.value >= 1000 ? '#fde047' : '#ffffff', opacity: 1, life: 25 });
          }
        }
        updateHUD();
        items.splice(i, 1);
        continue;
      }

      if (it.y - it.radius > canvas.height) {
        items.splice(i, 1);
      }
    }

    // 부유 텍스트
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y -= 1.8;
      ft.opacity -= 1 / ft.life;
      if (ft.opacity <= 0) floatingTexts.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 눈송이
    ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
    snowflakes.forEach(snow => {
      ctx.beginPath();
      ctx.arc(snow.x, snow.y, snow.radius, 0, Math.PI * 2);
      ctx.fill();
    });

    // 2. 바닥 눈밭 언덕
    ctx.fillStyle = '#e2e8f0';
    ctx.beginPath();
    ctx.ellipse(120, 710, 240, 60, 0, 0, Math.PI * 2);
    ctx.ellipse(320, 715, 200, 55, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.ellipse(200, 725, 260, 60, 0, 0, Math.PI * 2);
    ctx.fill();

    // 3. 떨어지는 아이템
    items.forEach(it => {
      ctx.save();
      ctx.beginPath();
      ctx.arc(it.x, it.y, it.radius, 0, Math.PI * 2);
      ctx.fillStyle = it.color;
      ctx.fill();
      ctx.lineWidth = it.type === '5000' ? 3.5 : 2.5;
      ctx.strokeStyle = it.type === 'ice' ? '#3b82f6' : '#b45309';
      ctx.stroke();

      if (it.type === '5000') {
        ctx.fillStyle = '#78350f';
        ctx.font = '900 13px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('5000', it.x, it.y);
      } else {
        ctx.fillStyle = it.type === 'ice' ? '#1e3a8a' : '#78350f';
        ctx.font = 'bold 12px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.type === 'ice' ? '❄️' : it.type, it.x, it.y);
      }
      ctx.restore();
    });

    // 4. 구세군 자선냄비
    drawRedKettle(kettle.x, kettle.y, kettle.width, kettle.height);

    // 5. 부유 텍스트
    floatingTexts.forEach(ft => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.opacity);
      ctx.fillStyle = ft.color;
      ctx.font = ft.scale ? '900 20px -apple-system, sans-serif' : 'bold 17px -apple-system, sans-serif';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 4;
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    });

    requestAnimationFrame(draw);
  }

  // 자선냄비 그래픽
  function drawRedKettle(x, y, w, h) {
    ctx.save();
    
    // 거치대 삼각대
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + 10, y + h + 8);
    ctx.lineTo(x + w / 2, y + 2);
    ctx.lineTo(x + w - 10, y + h + 8);
    ctx.stroke();

    // 상단 체인
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y + 2);
    ctx.lineTo(x + w / 2, y + 16);
    ctx.stroke();

    // 냄비 본체
    const potX = x + 8;
    const potY = y + 16;
    const potW = w - 16;
    const potH = h - 22;

    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.roundRect(potX, potY, potW, potH, [4, 4, 16, 16]);
    ctx.fill();

    // 냄비 림
    ctx.fillStyle = '#b91c1c';
    ctx.fillRect(potX - 3, potY - 2, potW + 6, 6);

    // 냄비 손잡이
    ctx.strokeStyle = '#7f1d1d';
    ctx.lineWidth = 3;
    ctx.strokeRect(potX - 5, potY + 8, 4, 10);
    ctx.strokeRect(potX + potW + 1, potY + 8, 4, 10);

    // 구세군 텍스트 & 종 마크
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('구세군', potX + potW / 2, potY + potH / 2 - 2);

    ctx.font = '14px sans-serif';
    ctx.fillText('🔔', potX + potW / 2, potY + potH / 2 + 13);

    ctx.restore();
  }

  function gameLoop() {
    update();
    setTimeout(gameLoop, 1000 / 60);
  }

  /* ----------------------------------------------------
     3. 인터랙션 및 제어
  ---------------------------------------------------- */
  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const hudScore = document.getElementById('hud-score');
  const hudTimer = document.getElementById('hud-timer');
  const soundBtn = document.getElementById('sound-btn');

  function updateHUD() {
    hudScore.textContent = `🪙 ${score.toLocaleString()}원`;
    hudTimer.textContent = `⏱️ ${timeLeft}초`;
  }

  function startGame() {
    initAudio();
    score = 0;
    timeLeft = GAME_DURATION;
    items = [];
    floatingTexts = [];
    kettle.x = canvas.width / 2 - kettle.width / 2;
    isPlaying = true;
    updateHUD();

    startScreen.classList.add('hidden');
    gameoverScreen.classList.add('hidden');

    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (!isPlaying) return;
      timeLeft--;
      updateHUD();
      if (timeLeft <= 0) {
        endGame();
      }
    }, 1000);
  }

  function endGame() {
    isPlaying = false;
    if (timerInterval) clearInterval(timerInterval);
    playSound('gameover');
    saveHighScore(score);

    document.getElementById('final-score').textContent = `${score.toLocaleString()}원`;
    document.getElementById('best-score-label').textContent = `👑 최고 기록: ${getHighScore().toLocaleString()}원`;
    gameoverScreen.classList.remove('hidden');
  }

  // 키보드 조작
  window.addEventListener('keydown', (e) => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
  });
  window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
  });

  // 터치 & 마우스 조작
  function handlePointer(clientX) {
    if (!isPlaying) return;
    const rect = canvas.getBoundingClientRect();
    const scale = canvas.width / rect.width;
    const canvasX = (clientX - rect.left) * scale;
    kettle.x = canvasX - kettle.width / 2;
  }

  canvas.addEventListener('mousemove', (e) => handlePointer(e.clientX));
  canvas.addEventListener('touchmove', (e) => {
    handlePointer(e.touches[0].clientX);
    e.preventDefault();
  }, { passive: false });

  // 버튼 리스너
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);

  soundBtn.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
  });

  // 실행
  draw();
  gameLoop();
</script>
</body>
</html>
